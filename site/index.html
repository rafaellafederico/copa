<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bolão da Copa</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;800&family=Archivo:wght@400;500;700&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --pitch:#0C3327; --pitch2:#0F4032; --line:#1C5A47;
    --chalk:#F5F2E8; --gold:#E5B84A; --red:#CE4A33; --green-ok:#5BBF7A; --ink:#0A1F18;
  }
  *{box-sizing:border-box;margin:0}
  body{background:var(--pitch);color:var(--chalk);font-family:'Archivo',sans-serif;min-height:100vh}
  .hide{display:none!important}
  /* header */
  .hdr{padding:18px 16px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .hdr h1{font-family:'Saira Condensed';font-weight:800;font-size:24px;letter-spacing:.04em;text-transform:uppercase}
  .hdr h1 em{color:var(--gold);font-style:normal}
  .who{font-size:12px;opacity:.75;text-align:right}
  .who a{color:var(--gold);cursor:pointer;text-decoration:underline}
  .wrap{padding:16px;max-width:560px;margin:0 auto 90px}
  /* auth */
  .gate{max-width:420px;margin:0 auto;padding:48px 20px}
  .gate h1{font-family:'Saira Condensed';font-weight:800;font-size:40px;text-transform:uppercase;line-height:1}
  .gate h1 em{color:var(--gold);font-style:normal}
  .gate p{opacity:.7;font-size:14px;margin:8px 0 24px}
  .authtabs{display:flex;gap:8px;margin-bottom:16px}
  .authtab{flex:1;padding:10px;background:none;border:1px solid var(--line);border-radius:8px;color:var(--chalk);opacity:.6;font-family:'Saira Condensed';font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
  .authtab.on{opacity:1;border-color:var(--gold);color:var(--gold)}
  .inp{width:100%;padding:13px;border-radius:8px;border:1px solid var(--line);background:var(--ink);color:var(--chalk);font-size:15px;margin-bottom:10px;font-family:'Archivo'}
  .inp::placeholder{color:#8aa79b}
  .btn-big{width:100%;padding:14px;border:none;border-radius:8px;background:var(--gold);color:var(--pitch);font-family:'Saira Condensed';font-weight:800;font-size:18px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;margin-top:4px}
  .msg{font-size:13px;margin-top:10px;min-height:18px}
  .msg.err{color:var(--red)} .msg.ok{color:var(--green-ok)}
  /* cards de jogo */
  .mcard{background:var(--pitch2);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
  .mcard-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .mdate{font-size:12px;opacity:.65}
  .tag{font-family:'Saira Condensed';font-weight:600;font-size:12px;letter-spacing:.1em;padding:2px 8px;border-radius:4px;border:1px solid var(--line)}
  .tag-open{color:var(--gold);border-color:var(--gold)}
  .tag-lock{opacity:.6}
  .tag-done{color:var(--pitch);background:var(--gold);border-color:var(--gold)}
  .board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:6px 0 10px}
  .team{font-family:'Saira Condensed';font-weight:800;font-size:19px;text-transform:uppercase;letter-spacing:.03em;text-align:center;line-height:1.1}
  .x{opacity:.5;font-size:18px;padding:0 4px}
  .score-edit,.score-final{display:flex;align-items:center;gap:4px;justify-content:center}
  .score-final span{font-family:'Saira Condensed';font-weight:800;font-size:34px;color:var(--gold);min-width:30px;text-align:center}
  .score-final .x{font-size:20px;color:var(--chalk)}
  .stp{display:flex;align-items:center;background:var(--ink);border-radius:8px;overflow:hidden}
  .stp button{width:34px;height:42px;background:none;border:none;color:var(--chalk);font-size:20px;cursor:pointer}
  .stp button:active{background:var(--line)}
  .stp .v{font-family:'Saira Condensed';font-weight:800;font-size:26px;min-width:34px;text-align:center}
  .cards-row{display:flex;justify-content:space-between;align-items:center;border-top:1px dashed var(--line);padding-top:10px}
  .cards-row .lbl{font-size:13px;opacity:.85}
  .cards-final{font-family:'Saira Condensed';font-weight:800;font-size:22px;color:var(--gold)}
  .btn-save{width:100%;margin-top:12px;padding:12px;border:none;border-radius:8px;background:var(--gold);color:var(--pitch);font-family:'Saira Condensed';font-weight:800;font-size:16px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
  .btn-save.saved{background:transparent;border:1px solid var(--line);color:var(--chalk);opacity:.8}
  /* resultado / acertos */
  .verdict{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;font-size:13px}
  .verdict .mine{opacity:.85;margin-bottom:8px}
  .badges{display:flex;flex-wrap:wrap;gap:6px}
  .bdg{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;border:1px solid}
  .bdg-ok{color:var(--green-ok);border-color:var(--green-ok)}
  .bdg-no{color:var(--red);border-color:var(--red);opacity:.85}
  .bdg-pts{color:var(--pitch);background:var(--gold);border-color:var(--gold);font-family:'Saira Condensed';font-weight:800;font-size:14px;letter-spacing:.04em}
  .allbets-toggle{margin-top:10px;background:none;border:none;color:var(--gold);font-size:12px;font-weight:700;cursor:pointer;text-decoration:underline;padding:0}
  .allbets{margin-top:8px;font-size:13px}
  .ab-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
  .ab-row .pts{font-family:'Saira Condensed';font-weight:800;color:var(--gold)}
  .empty{text-align:center;opacity:.6;padding:40px 16px;font-size:14px;line-height:1.6}
  .chips{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .chip{padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:none;color:var(--chalk);font-size:13px;font-weight:700;cursor:pointer;opacity:.7}
  .chip.on{border-color:var(--gold);color:var(--gold);opacity:1}
  /* ranking */
  .rk-row{display:grid;grid-template-columns:32px 1fr auto;align-items:center;gap:10px;padding:12px 10px;border-bottom:1px solid var(--line)}
  .rk-pos{font-family:'Saira Condensed';font-weight:800;font-size:18px;opacity:.6;text-align:center}
  .rk-1 .rk-pos{color:var(--gold);opacity:1}
  .rk-name{font-weight:500}
  .rk-sub{font-size:11px;opacity:.55}
  .rk-pts{font-family:'Saira Condensed';font-weight:800;font-size:24px;color:var(--gold)}
  .rules{margin-top:18px;font-size:12px;opacity:.6;line-height:1.6}
  /* admin */
  .sec-title{font-family:'Saira Condensed';font-weight:800;font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin:22px 0 10px}
  .acard{background:var(--pitch2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
  .acard-head{display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:8px;font-size:14px}
  .acard-head .d{font-size:11px;opacity:.6}
  .acard-body{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}
  .arow{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px}
  .arow>span:first-child{width:74px;opacity:.8}
  .abtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  .btn-mini{padding:8px 12px;border-radius:6px;border:1px solid var(--gold);background:none;color:var(--gold);font-size:12px;font-weight:700;cursor:pointer}
  .btn-del{border-color:var(--red);color:var(--red)}
  .scfg{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:14px}
  /* tabs */
  .tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--ink);border-top:1px solid var(--line);z-index:10}
  .tabbtn{flex:1;padding:14px 0 18px;background:none;border:none;color:var(--chalk);opacity:.5;font-family:'Saira Condensed';font-weight:800;font-size:14px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
  .tabbtn.on{opacity:1;color:var(--gold)}
  @media (prefers-reduced-motion: no-preference){
    .mcard{animation:up .25s ease both}
    @keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  }
</style>
</head>
<body>

<!-- ===== TELA DE LOGIN / CADASTRO ===== -->
<div id="auth" class="gate hide">
  <h1>Bolão <em>da Copa</em></h1>
  <p>Cadastre-se pra palpitar. Placar + cartões de cada jogo.</p>
  <div class="authtabs">
    <button class="authtab on" id="tab-login" onclick="authMode('login')">Entrar</button>
    <button class="authtab" id="tab-signup" onclick="authMode('signup')">Cadastrar</button>
  </div>
  <input class="inp hide" id="a-name" placeholder="Seu nome (aparece no ranking)" />
  <input class="inp" id="a-email" type="email" placeholder="E-mail" />
  <input class="inp" id="a-pass" type="password" placeholder="Senha (mín. 6 caracteres)" />
  <button class="btn-big" id="a-go" onclick="doAuth()">Entrar</button>
  <div class="msg" id="a-msg"></div>
</div>

<!-- ===== APP ===== -->
<div id="app" class="hide">
  <div class="hdr">
    <h1>Bolão <em>da Copa</em></h1>
    <span class="who"><span id="who-name"></span><br><a onclick="logout()">sair</a></span>
  </div>
  <div class="wrap">
    <div id="view-jogos"></div>
    <div id="view-ranking" class="hide"></div>
    <div id="view-admin" class="hide"></div>
  </div>
  <div class="tabs">
    <button class="tabbtn on" id="tb-jogos" onclick="go('jogos')">Jogos</button>
    <button class="tabbtn" id="tb-ranking" onclick="go('ranking')">Ranking</button>
    <button class="tabbtn hide" id="tb-admin" onclick="go('admin')">Admin</button>
  </div>
</div>

<script>
/* ================== CONFIGURE AQUI ================== */
const SUPABASE_URL = "https://orfrakexhgmzapyoajka.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Wo7ux33xnvMb1w39rItAMg_db4njGSl";
/* ==================================================== */

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let me = null;          // { id, name, is_admin }
let matches = [];
let myBets = {};        // matchId -> bet
let settings = { pts_exact: 5, pts_outcome: 3, pts_cards: 2 };
let mode = "login";
let tab = "jogos";
let filter = "abertos";
const draft = {};       // edição local dos palpites
const openAll = {};     // toggle "palpites de todos"

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = (iso) => {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"}) + " " +
         d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
};
const isLocked = (m) => m.locked || m.res_home !== null || (m.kickoff && Date.now() >= new Date(m.kickoff).getTime());
const hasResult = (m) => m.res_home !== null && m.res_home !== undefined;

function calcPoints(bet, m, s) {
  if (!bet || !hasResult(m)) return null;
  const exact = bet.home === m.res_home && bet.away === m.res_away;
  const outcome = Math.sign(bet.home - bet.away) === Math.sign(m.res_home - m.res_away);
  let scorePts = exact ? s.pts_exact : (outcome ? s.pts_outcome : 0);
  const cardPts = bet.cards === m.res_cards ? s.pts_cards : 0;
  return { scorePts, cardPts, total: scorePts + cardPts, exact, outcome };
}

/* ---------- AUTH ---------- */
function authMode(m) {
  mode = m;
  $("tab-login").classList.toggle("on", m === "login");
  $("tab-signup").classList.toggle("on", m === "signup");
  $("a-name").classList.toggle("hide", m === "login");
  $("a-go").textContent = m === "login" ? "Entrar" : "Criar conta";
  $("a-msg").textContent = "";
}

async function doAuth() {
  const email = $("a-email").value.trim();
  const pass = $("a-pass").value;
  const msg = $("a-msg");
  msg.className = "msg err"; msg.textContent = "";
  if (!email || pass.length < 6) { msg.textContent = "Preencha e-mail e senha (mín. 6 caracteres)."; return; }
  if (mode === "signup") {
    const name = $("a-name").value.trim();
    if (!name) { msg.textContent = "Informe seu nome."; return; }
    const { error } = await sb.auth.signUp({ email, password: pass, options: { data: { name } } });
    if (error) { msg.textContent = traduzErro(error.message); return; }
    msg.className = "msg ok"; msg.textContent = "Conta criada! Entrando…";
  } else {
    const { error } = await sb.auth.signInWithPassword({ email, password: pass });
    if (error) { msg.textContent = traduzErro(error.message); return; }
  }
}

function traduzErro(m) {
  if (/already registered/i.test(m)) return "Esse e-mail já tem cadastro. Use a aba Entrar.";
  if (/invalid login/i.test(m)) return "E-mail ou senha incorretos.";
  if (/at least 6/i.test(m)) return "A senha precisa de no mínimo 6 caracteres.";
  if (/confirm/i.test(m)) return "Confirme seu e-mail antes de entrar (veja a caixa de entrada).";
  return "Erro: " + m;
}

async function logout() { await sb.auth.signOut(); location.reload(); }

sb.auth.onAuthStateChange(async (_e, session) => {
  if (session?.user) {
    const { data: p } = await sb.from("profiles").select("*").eq("id", session.user.id).single();
    me = p || { id: session.user.id, name: session.user.user_metadata?.name || "Você", is_admin: false };
    $("auth").classList.add("hide");
    $("app").classList.remove("hide");
    $("who-name").textContent = me.name;
    $("tb-admin").classList.toggle("hide", !me.is_admin);
    await loadCore();
    render();
  } else {
    $("app").classList.add("hide");
    $("auth").classList.remove("hide");
  }
});

/* ---------- DADOS ---------- */
async function loadCore() {
  const [{ data: s }, { data: ms }, { data: bs }] = await Promise.all([
    sb.from("settings").select("*").eq("id", 1).single(),
    sb.from("matches").select("*").order("kickoff", { ascending: true, nullsFirst: false }),
    sb.from("bets").select("*").eq("user_id", me.id),
  ]);
  if (s) settings = s;
  matches = ms || [];
  myBets = {};
  (bs || []).forEach(b => myBets[b.match_id] = b);
}

async function saveBet(matchId) {
  const d = draft[matchId];
  const btn = $("save-" + matchId);
  const { error } = await sb.from("bets").upsert({
    user_id: me.id, match_id: matchId,
    home: d.h, away: d.a, cards: d.c, updated_at: new Date().toISOString(),
  });
  if (error) { alert("Não foi possível salvar — o jogo pode já estar fechado."); await loadCore(); render(); return; }
  myBets[matchId] = { user_id: me.id, match_id: matchId, home: d.h, away: d.a, cards: d.c };
  btn.textContent = "Palpite salvo ✓"; btn.classList.add("saved");
}

/* ---------- RENDER ---------- */
function go(t) {
  tab = t;
  ["jogos","ranking","admin"].forEach(x => {
    $("view-" + x).classList.toggle("hide", x !== t);
    $("tb-" + x).classList.toggle("on", x === t);
  });
  render();
}

async function render() {
  if (tab === "jogos") renderJogos();
  if (tab === "ranking") renderRanking();
  if (tab === "admin") renderAdmin();
}

function stepper(id, val, max, accent) {
  return `<div class="stp">
    <button onclick="step('${id}',-1,${max})">−</button>
    <div class="v ${accent?'gold':''}" id="v-${id}" ${accent?'style="color:var(--gold)"':''}>${val}</div>
    <button onclick="step('${id}',1,${max})">+</button>
  </div>`;
}
window.step = (id, d, max) => {
  const [kind, mid] = id.split("|");
  const dr = draft[mid];
  const key = kind === "h" ? "h" : kind === "a" ? "a" : "c";
  dr[key] = Math.min(max, Math.max(0, dr[key] + d));
  $("v-" + id).textContent = dr[key];
  const btn = $("save-" + mid);
  if (btn) { btn.textContent = "Salvar palpite"; btn.classList.remove("saved"); }
};

window.setFilter = (f) => { filter = f; renderJogos(); };
const FILTER_LABELS = { abertos: "Abertos", hoje: "Hoje", encerrados: "Encerrados", todos: "Todos" };

function renderJogos() {
  const el = $("view-jogos");
  if (!matches.length) {
    el.innerHTML = `<div class="empty">Nenhum jogo carregado ainda.<br>Os jogos da Copa entram automaticamente. ⚽</div>`;
    return;
  }
  const today = new Date().toDateString();
  let list = matches;
  if (filter === "abertos") list = matches.filter(m => !isLocked(m));
  else if (filter === "hoje") list = matches.filter(m => m.kickoff && new Date(m.kickoff).toDateString() === today);
  else if (filter === "encerrados") list = matches.filter(m => isLocked(m)).slice().reverse();
  const chips = `<div class="chips">` + Object.keys(FILTER_LABELS).map(f =>
    `<button class="chip ${filter === f ? "on" : ""}" onclick="setFilter('${f}')">${FILTER_LABELS[f]}</button>`).join("") + `</div>`;
  el.innerHTML = chips + (list.length ? "" : `<div class="empty">Nenhum jogo neste filtro.</div>`) + list.map(m => {
    const locked = isLocked(m);
    const bet = myBets[m.id];
    if (!draft[m.id]) draft[m.id] = { h: bet?.home ?? 0, a: bet?.away ?? 0, c: bet?.cards ?? 0 };
    const d = draft[m.id];
    const tag = hasResult(m) ? `<span class="tag tag-done">ENCERRADO</span>`
              : locked ? `<span class="tag tag-lock">FECHADO</span>`
              : `<span class="tag tag-open">ABERTO</span>`;
    let middle, footer = "";

    if (!locked) {
      middle = `<div class="score-edit">${stepper("h|"+m.id, d.h, 15)}<span class="x">×</span>${stepper("a|"+m.id, d.a, 15)}</div>`;
      footer = `
        <div class="cards-row"><span class="lbl">🟨 Cartões no jogo</span>${stepper("c|"+m.id, d.c, 20, true)}</div>
        <button class="btn-save ${bet ? "saved" : ""}" id="save-${m.id}" onclick="saveBet('${m.id}')">${bet ? "Palpite salvo ✓" : "Salvar palpite"}</button>`;
    } else {
      const sh = hasResult(m) ? m.res_home : (bet ? bet.home : "–");
      const sa = hasResult(m) ? m.res_away : (bet ? bet.away : "–");
      middle = `<div class="score-final"><span>${sh}</span><span class="x">×</span><span>${sa}</span></div>`;
      const cardsShow = hasResult(m) ? m.res_cards : (bet ? bet.cards : "–");
      footer = `<div class="cards-row"><span class="lbl">🟨 Cartões no jogo</span><span class="cards-final">${cardsShow}</span></div>`;

      if (hasResult(m)) {
        if (bet) {
          const p = calcPoints(bet, m, settings);
          footer += `<div class="verdict">
            <div class="mine">Seu palpite: <b>${bet.home} × ${bet.away}</b> · ${bet.cards} cartões</div>
            <div class="badges">
              ${p.exact ? `<span class="bdg bdg-ok">✓ Placar exato +${settings.pts_exact}</span>`
                : p.outcome ? `<span class="bdg bdg-ok">✓ Acertou o vencedor +${settings.pts_outcome}</span>`
                : `<span class="bdg bdg-no">✗ Errou o resultado</span>`}
              ${p.cardPts > 0 ? `<span class="bdg bdg-ok">✓ Cartões +${settings.pts_cards}</span>`
                : `<span class="bdg bdg-no">✗ Cartões</span>`}
              <span class="bdg bdg-pts">+${p.total} PTS</span>
            </div>
          </div>`;
        } else {
          footer += `<div class="verdict"><div class="mine" style="opacity:.55">Você não palpitou neste jogo.</div></div>`;
        }
        footer += `<button class="allbets-toggle" onclick="toggleAll('${m.id}')">${openAll[m.id] ? "esconder" : "ver"} palpites de todos</button>
                   <div class="allbets" id="all-${m.id}"></div>`;
      } else if (bet) {
        footer += `<div class="verdict"><div class="mine">Seu palpite: <b>${bet.home} × ${bet.away}</b> · ${bet.cards} cartões — aguardando resultado.</div></div>`;
      }
    }

    return `<div class="mcard">
      <div class="mcard-top"><span class="mdate">${m.round ? esc(m.round) + " · " : ""}${fmtDate(m.kickoff)}</span>${tag}</div>
      <div class="board"><div class="team">${esc(m.home)}</div>${middle}<div class="team">${esc(m.away)}</div></div>
      ${footer}
    </div>`;
  }).join("");
  // recarrega listas abertas
  list.forEach(m => { if (openAll[m.id]) loadAllBets(m.id); });
}

window.toggleAll = async (mid) => {
  openAll[mid] = !openAll[mid];
  renderJogos();
};

async function loadAllBets(mid) {
  const box = $("all-" + mid);
  if (!box) return;
  box.innerHTML = `<div style="opacity:.5;font-size:12px;padding:6px 0">carregando…</div>`;
  const [{ data: bs }, { data: ps }] = await Promise.all([
    sb.from("bets").select("*").eq("match_id", mid),
    sb.from("profiles").select("id,name"),
  ]);
  const names = {}; (ps || []).forEach(p => names[p.id] = p.name);
  const m = matches.find(x => x.id === mid);
  const rows = (bs || []).map(b => {
    const p = calcPoints(b, m, settings);
    return { name: names[b.user_id] || "?", b, pts: p ? p.total : 0 };
  }).sort((x, y) => y.pts - x.pts);
  box.innerHTML = rows.length
    ? rows.map(r => `<div class="ab-row"><span>${esc(r.name)} — ${r.b.home}×${r.b.away} · ${r.b.cards} 🟨</span><span class="pts">+${r.pts}</span></div>`).join("")
    : `<div style="opacity:.5;font-size:12px;padding:6px 0">ninguém palpitou.</div>`;
}

/* ---------- RANKING ---------- */
async function renderRanking() {
  const el = $("view-ranking");
  el.innerHTML = `<div class="empty">Calculando…</div>`;
  const [{ data: bs }, { data: ps }] = await Promise.all([
    sb.from("bets").select("*"),
    sb.from("profiles").select("id,name"),
  ]);
  const byUser = {};
  (ps || []).forEach(p => byUser[p.id] = { name: p.name, total: 0, exacts: 0, hits: 0 });
  (bs || []).forEach(b => {
    const m = matches.find(x => x.id === b.match_id);
    if (!m || !hasResult(m)) return;
    const p = calcPoints(b, m, settings);
    if (!p || !byUser[b.user_id]) return;
    byUser[b.user_id].total += p.total;
    if (p.exact) byUser[b.user_id].exacts++;
    else if (p.outcome) byUser[b.user_id].hits++;
  });
  const rows = Object.values(byUser).sort((a, b) => b.total - a.total || b.exacts - a.exacts);
  el.innerHTML = (rows.length ? rows.map((r, i) => `
    <div class="rk-row ${i === 0 ? "rk-1" : ""}">
      <span class="rk-pos">${i + 1}</span>
      <span><div class="rk-name">${esc(r.name)}</div>
      <div class="rk-sub">${r.exacts} placar(es) exato(s) · ${r.hits} vencedor(es)</div></span>
      <span class="rk-pts">${r.total}</span>
    </div>`).join("") : `<div class="empty">Ninguém cadastrado ainda.</div>`)
    + `<div class="rules">Pontuação: placar exato +${settings.pts_exact} · acertou vencedor/empate +${settings.pts_outcome} · cartões exatos +${settings.pts_cards}. Desempate: mais placares exatos.</div>`;
}

/* ---------- ADMIN ---------- */
function renderAdmin() {
  const el = $("view-admin");
  el.innerHTML = `
    <div class="sec-title">Novo jogo</div>
    <input class="inp" id="n-home" placeholder="Time da casa (ex: Brasil)">
    <input class="inp" id="n-away" placeholder="Time visitante (ex: Argentina)">
    <input class="inp" id="n-kick" type="datetime-local">
    <button class="btn-big" onclick="addMatch()">Adicionar jogo</button>
    <div class="sec-title">Jogos</div>
    <div id="adm-list">${matches.map(admCard).join("") || `<div class="empty">Nenhum jogo.</div>`}</div>
    <div class="sec-title">Pontuação</div>
    <div class="scfg"><span>Placar exato</span><input class="inp" style="width:80px;margin:0;text-align:center" id="s-exact" type="number" value="${settings.pts_exact}"></div>
    <div class="scfg"><span>Acertou vencedor/empate</span><input class="inp" style="width:80px;margin:0;text-align:center" id="s-outcome" type="number" value="${settings.pts_outcome}"></div>
    <div class="scfg"><span>Cartões exatos</span><input class="inp" style="width:80px;margin:0;text-align:center" id="s-cards" type="number" value="${settings.pts_cards}"></div>
    <button class="btn-big" onclick="saveSettings()">Salvar pontuação</button>`;
}

function admCard(m) {
  return `<div class="acard">
    <div class="acard-head" onclick="document.getElementById('ab-${m.id}').classList.toggle('hide')">
      <span><b>${esc(m.home)} × ${esc(m.away)}</b> <span class="d">${fmtDate(m.kickoff)}</span></span>
      <span class="tag">${hasResult(m) ? `${m.res_home}×${m.res_away}` : m.locked ? "fechado" : "aberto"}</span>
    </div>
    <div class="acard-body hide" id="ab-${m.id}">
      <div class="arow"><span>Resultado</span>
        <input class="inp" style="width:64px;margin:0;text-align:center" type="number" min="0" id="rh-${m.id}" value="${m.res_home ?? 0}">
        <span class="x">×</span>
        <input class="inp" style="width:64px;margin:0;text-align:center" type="number" min="0" id="ra-${m.id}" value="${m.res_away ?? 0}">
      </div>
      <div class="arow"><span>Cartões</span>
        <input class="inp" style="width:64px;margin:0;text-align:center" type="number" min="0" id="rc-${m.id}" value="${m.res_cards ?? 0}">
      </div>
      <div class="abtns">
        <button class="btn-mini" onclick="setResult('${m.id}')">Lançar resultado</button>
        <button class="btn-mini" onclick="toggleLock('${m.id}', ${!m.locked})">${m.locked ? "Reabrir palpites" : "Fechar palpites"}</button>
        ${hasResult(m) ? `<button class="btn-mini" onclick="clearResult('${m.id}')">Remover resultado</button>` : ""}
        <button class="btn-mini btn-del" onclick="delMatch('${m.id}')">Excluir</button>
      </div>
    </div>
  </div>`;
}

window.addMatch = async () => {
  const home = $("n-home").value.trim(), away = $("n-away").value.trim();
  const kick = $("n-kick").value;
  if (!home || !away) return;
  const { error } = await sb.from("matches").insert({ home, away, kickoff: kick ? new Date(kick).toISOString() : null });
  if (error) { alert("Erro: " + error.message); return; }
  await loadCore(); renderAdmin();
};
window.setResult = async (id) => {
  const res_home = +$("rh-" + id).value, res_away = +$("ra-" + id).value, res_cards = +$("rc-" + id).value;
  const { error } = await sb.from("matches").update({ res_home, res_away, res_cards }).eq("id", id);
  if (error) { alert("Erro: " + error.message); return; }
  await loadCore(); renderAdmin();
};
window.clearResult = async (id) => {
  await sb.from("matches").update({ res_home: null, res_away: null, res_cards: null }).eq("id", id);
  await loadCore(); renderAdmin();
};
window.toggleLock = async (id, locked) => {
  await sb.from("matches").update({ locked }).eq("id", id);
  await loadCore(); renderAdmin();
};
window.delMatch = async (id) => {
  if (!confirm("Excluir este jogo? Os palpites dele também somem.")) return;
  await sb.from("matches").delete().eq("id", id);
  await loadCore(); renderAdmin();
};
window.saveSettings = async () => {
  const pts_exact = +$("s-exact").value, pts_outcome = +$("s-outcome").value, pts_cards = +$("s-cards").value;
  const { error } = await sb.from("settings").update({ pts_exact, pts_outcome, pts_cards }).eq("id", 1);
  if (error) { alert("Erro: " + error.message); return; }
  settings = { pts_exact, pts_outcome, pts_cards };
  alert("Pontuação salva.");
};

/* expõe pro HTML inline */
window.authMode = authMode;
window.doAuth = doAuth;
window.logout = logout;
window.go = go;
window.saveBet = saveBet;
</script>
</body>
